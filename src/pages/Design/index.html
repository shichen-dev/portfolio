    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 40px 20px;
        transition:
          background 0.3s,
          color 0.3s;
        min-height: 100vh;
        --max-width: 700px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      h1 svg {
        width: 28px;
        height: 28px;
      }

      /* 作品计数 */
      .item-count {
        text-align: center;
        margin-bottom: 20px;
        font-size: 14px;
        color: var(--text-secondary, #666);
      }

      /* 筛选栏样式，保持与 .item 统一 */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        margin-bottom: 30px;
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 10px;
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .filter-btn {
        padding: 8px 16px;
        border: 1px solid var(--border-color, #d1d5db);
        background: var(--card);
        color: var(--text-secondary);
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 500;
      }

      .filter-btn:hover {
        border-color: var(--primary-color, #6366f1);
        color: var(--primary-color, #6366f1);
        transform: translateY(-1px);
      }

      .filter-btn.active {
        background: rgba(99, 102, 241, 0.14);
        color: var(--accent);
        border-color: rgba(99, 102, 241, 0.22);
        box-shadow: none;
      }

      /* 作品列表容器 */
      .pages-list {
        transition: opacity 0.3s ease;
      }

      /* 作品项样式 */
      .item {
        display: block;
        width: 100%;
        background: var(--card);
        padding: 20px 22px;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: inherit;
        position: relative;
        transition: all 0.3s ease;
        border: 1px solid transparent;
        opacity: 1;
        transform: translateY(0);
      }

      .item:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.08);
        border-color: rgba(99, 102, 241, 0.25);
      }

      .item.hidden {
        display: none;
      }

      /* 标题 */
      .item .name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        line-height: 1.4;
        color: var(--text);
        padding-right: 70px;
      }

      /* 描述 */
      .item .desc {
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-secondary, #666);
        margin-bottom: 14px;
      }

      /* 技术栈 */
      .item .tech {
        font-size: 12px;
        color: var(--text-muted, #999);
        letter-spacing: 0.3px;
        margin-bottom: 12px;
      }

      /* 标签按钮 */
      .item .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.12);
        color: rgba(99, 102, 241, 1);
        position: absolute;
        top: 16px;
        right: 18px;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s ease;
        user-select: none;
        text-decoration: none;
      }

      .item .tag:hover {
        background: rgba(99, 102, 241, 0.2);
        transform: scale(1.05);
      }

      /* 增加极简动效 */
      .item::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        transform: scale(0.98);
      }

      .item:hover::after {
        opacity: 1;
        transform: scale(1);
      }

      /* 无结果提示 */
      .no-results {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary, #666);
        display: none;
      }

      .no-results.show {
        display: block;
      }

      .no-results svg {
        width: 48px;
        height: 48px;
        margin-bottom: 16px;
        color: var(--text-muted, #999);
      }

      /* 响应式调整 */
      @media (max-width: 640px) {
        body {
          padding: 20px 16px;
        }

        .filter-bar {
          gap: 8px;
          padding-bottom: 15px;
          justify-content: flex-start;
          overflow-x: auto;
          white-space: nowrap;
          -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
          padding: 6px 12px;
          font-size: 13px;
          flex-shrink: 0;
        }

        .item {
          padding: 16px 18px;
        }

        .item .name {
          font-size: 16px;
          padding-right: 60px;
        }
      }
    </style>

    <!-- 作品筛选功能脚本 -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 获取DOM元素
        const filterButtons = document.querySelectorAll(".filter-btn");
        const pagesItems = document.querySelectorAll(".pages-list .item");
        const tagButtons = document.querySelectorAll(".item .tag");
        const itemCount = document.getElementById("current-count");
        const noResults = document.getElementById("no-results");
        const pagesList = document.querySelector(".pages-list");

        // 初始显示所有作品
        updateItemCount("all");

        // 筛选函数
        function filterpages(category) {
          let visibleCount = 0;

          pagesItems.forEach((item) => {
            const shouldShow =
              category === "all" || item.dataset.category === category;

            if (shouldShow) {
              item.classList.remove("hidden");
              // 添加淡入动画
              setTimeout(() => {
                item.style.opacity = "1";
                item.style.transform = "translateY(0)";
              }, 10);
              visibleCount++;
            } else {
              item.classList.add("hidden");
              item.style.opacity = "0";
              item.style.transform = "translateY(10px)";
            }
          });

          // 更新作品计数
          updateItemCount(category, visibleCount);

          // 更新筛选按钮状态
          filterButtons.forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.filter === category);
          });

          // 显示/隐藏无结果提示
          if (visibleCount === 0) {
            noResults.classList.add("show");
            pagesList.style.opacity = "0.5";
          } else {
            noResults.classList.remove("show");
            pagesList.style.opacity = "1";
          }
        }

        // 更新作品计数
        function updateItemCount(category, count = null) {
          const totalCount = pagesItems.length;

          if (count === null) {
            count =
              category === "all"
                ? totalCount
                : Array.from(pagesItems).filter(
                    (item) => item.dataset.category === category,
                  ).length;
          }

          itemCount.textContent = count;
        }

        // 为顶部筛选栏按钮绑定事件
        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const filterValue = button.getAttribute("data-filter");
            filterpages(filterValue);

            // 更新URL（不刷新页面），便于分享当前状态
            const url = new URL(window.location);
            if (filterValue === "all") {
              url.searchParams.delete("filter");
            } else {
              url.searchParams.set("filter", filterValue);
            }
            history.replaceState(null, "", url);
          });
        });

        // 为卡片上的标签按钮绑定事件
        tagButtons.forEach((tag) => {
          tag.addEventListener("click", (event) => {
            event.stopPropagation(); // 防止触发卡片点击
            event.preventDefault(); // 防止默认行为

            const filterValue = tag.getAttribute("data-filter");
            filterpages(filterValue);

            // 更新对应的筛选按钮状态
            filterButtons.forEach((btn) => {
              btn.classList.toggle(
                "active",
                btn.dataset.filter === filterValue,
              );
            });

            // 更新URL
            const url = new URL(window.location);
            url.searchParams.set("filter", filterValue);
            history.replaceState(null, "", url);

            // 平滑滚动到筛选栏
            document.querySelector(".filter-bar").scrollIntoView({
              behavior: "smooth",
              block: "center",
            });
          });
        });

        // 页面加载时检查URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const initialFilter = urlParams.get("filter");
        if (initialFilter) {
          const targetButton = document.querySelector(
            `.filter-btn[data-filter="${initialFilter}"]`,
          );
          if (targetButton) {
            // 延迟执行以确保DOM已完全加载
            setTimeout(() => {
              targetButton.click();
            }, 100);
          }
        }

        // 卡片点击事件（确保标签点击不会触发卡片跳转）
        pagesItems.forEach((item) => {
          item.addEventListener("click", (event) => {
            // 如果点击的是标签，不跳转
            if (event.target.classList.contains("tag")) {
              event.preventDefault();
              return false;
            }
          });
        });
      });
    </script>
